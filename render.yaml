# Render blueprint: one free Python web service.
# Push this repo to GitHub, then in Render: New + -> Blueprint -> pick the repo.
services:
  - type: web
    name: mlb-hr-chart
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Bind to Render's injected $PORT. 1 worker to stay under the 512MB free
    # tier, but THREADED: the 30-90s board build (mostly network I/O) blocks a
    # thread, not the process, so /healthz keeps answering and Render doesn't
    # kill the worker mid-build (which caused 502s). Long timeout for the build.
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --worker-class gthread --timeout 300"
    healthCheckPath: "/healthz"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BOARD_CACHE_TTL
        value: "900"
      - key: LEADERBOARD_LIMIT
        value: "50"
      - key: ODDS_PROVIDER
        value: "actionnetwork"
