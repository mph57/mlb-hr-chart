# Render blueprint: one free Python web service.
# Push this repo to GitHub, then in Render: New + -> Blueprint -> pick the repo.
services:
  - type: web
    name: mlb-hr-chart
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    # Bind to Render's injected $PORT. 1 worker (free tier = 512MB RAM); long
    # timeout because the first request of a cold container builds the board
    # from ~500 live API calls (30-90s).
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1"
    healthCheckPath: "/healthz"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BOARD_CACHE_TTL
        value: "900"
      - key: LEADERBOARD_LIMIT
        value: "50"
      - key: ODDS_PROVIDER
        value: "actionnetwork"
